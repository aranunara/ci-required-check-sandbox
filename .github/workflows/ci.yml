name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  lint:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: reviewdog/action-golangci-lint@v2
        with:
          reporter: github-pr-review
          level: error
          fail_level: error
          filter_mode: nofilter
          reviewdog_version: v0.21.3
          golangci_lint_version: v2.12.2
  ci-ok:
    name: ${{ github.event.pull_request.draft && 'ci-draft' || 'ci-ok' }}
    needs: [lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.pull_request.draft }}
        run: echo "draft - not checked"
      - if: ${{ !github.event.pull_request.draft && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) }}
        run: exit 1
